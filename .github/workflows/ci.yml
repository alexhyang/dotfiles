name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: shellcheck bootstrap.sh bootstrap/*.sh shell/.shell_utils/*.sh shell/.load_shell_utils.sh

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, debian, fedora, arch]
        include:
          - distro: ubuntu
            dockerfile: Dockerfile.ubuntu
          - distro: debian
            dockerfile: Dockerfile.debian
          - distro: fedora
            dockerfile: Dockerfile.fedora
          - distro: arch
            dockerfile: Dockerfile.arch
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image (${{ matrix.distro }})
        run: docker build -f ${{ matrix.dockerfile }} -t dotfiles-test-${{ matrix.distro }} .
